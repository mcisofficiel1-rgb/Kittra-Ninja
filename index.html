<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>KITTRA V12 ETERNEL</title>
<style>
body{background:#000;color:red;text-align:center;font-family:monospace;margin:0}
#eye{width:150px;height:150px;margin:15px auto;background:radial-gradient(circle,#f00 20%,#000033 70%);border-radius:50%;box-shadow:0 0 30px red;animation:pulse 1.2s infinite}
button{width:92%;padding:18px;margin:8px;background:#111;color:#f00;border:2px solid #f00;border-radius:12px;font-weight:bold;font-size:17px}
#out{background:#050000;border:1px solid red;padding:12px;margin:10px;min-height:160px;color:#0f8;text-align:left;white-space:pre-wrap;font-size:13px}
@keyframes pulse{50%{box-shadow:0 0 60px red}}
.status{color:#0f8;font-size:12px}
</style></head><body>
<div id="eye" onclick="playScanner()"></div>
<h1>KITTRA V12 NINJA ETERNEL</h1>
<p class="status">CLIQUE L'OEIL = SCANNER KITT | ANTI-DORMEUR ACTIF</p>
<button onclick="do1()">📊 1. TRANSACTIONS & COFFRE</button>
<button onclick="do2()">🛡️ 2. STATUS COMPLET</button>
<button onclick="do3()">⏰ 3. PING ANTI-DORMEUR</button>
<div id="out">KITT V12 scanner prêt... Gardien</div>
<script>
let audioCtx=null;
function playScanner(){
 if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 let osc=audioCtx.createOscillator(); let gain=audioCtx.createGain();
 osc.type='sawtooth'; osc.frequency.value=120; gain.gain.value=0.3;
 osc.connect(gain); gain.connect(audioCtx.destination); osc.start();
 let t=audioCtx.currentTime;
 osc.frequency.linearRampToValueAtTime(400, t+0.3);
 osc.frequency.linearRampToValueAtTime(120, t+0.6);
 osc.frequency.linearRampToValueAtTime(400, t+0.9);
 gain.gain.linearRampToValueAtTime(0, t+1); osc.stop(t+1);
 document.getElementById('eye').style.animationDuration='0.1s';
 setTimeout(()=>document.getElementById('eye').style.animationDuration='1.2s',1000);
}
let voice=null; speechSynthesis.onvoiceschanged=()=>{voice=speechSynthesis.getVoices().find(v=>v.lang.includes('fr'))};
function speak(t){speechSynthesis.cancel();let m=new SpeechSynthesisUtterance(t);m.voice=voice;m.lang='fr-FR';m.rate=0.82;m.pitch=0.45;speechSynthesis.speak(m); playScanner();}

async function do1(){
 playScanner();
 let r=await fetch('/api/transactions');
 let j=await r.json();
 document.getElementById('out').innerText=`TRANSACTIONS V12:\nPrincipal: ${j.principal} USDT\nCoffre Total: ${j.coffre_total} USDT\nUrgences: ${j.urgences_usdt} USDT\nCoffres: ${JSON.stringify(j.coffres, null, 2)}`;
 speak(`Principal ${j.principal}. Coffre total ${j.coffre_total}.`);
}
async function do2(){
 playScanner();
 let r=await fetch('/api/status');
 let j=await r.json();
 document.getElementById('out').innerText=`STATUS V12 ETERNEL:\nPrincipal: ${j.principal} USDT\nCoffre: ${j.coffre_total} USDT\nPositions: ${JSON.stringify(j.positions, null, 2)}\nDerniere Activite: ${j.derniereActivite}`;
 speak(`Status complet. ${Object.keys(j.positions).length} positions actives.`);
}
async function do3(){
 playScanner();
 let r=await fetch('/ping');
 let j=await r.json();
 document.getElementById('out').innerText=`ANTI-DORMEUR:\n${j.status}\nCapital: ${j.capital}$\nCoffre: ${j.coffre}$\n\nUptimeRobot doit frapper ici toutes les 5 min`;
 speak(`Anti-dormeur actif. Kittra ne dort plus.`);
}
window.onload=()=>setTimeout(()=>{playScanner();setTimeout(()=>speak("Système KITT V12 Éternel activé Gardien. Mode anti-dormeur opérationnel."),800)},1000);
</script></body></html>
